<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreBoard</title>
    <link rel="stylesheet" href="style.css">
</head>
<header id="head">
    <div id="logo">
        <img src="assets\techpathshala_logo.svg" alt="techpathshala_logo">
    </div>
    <div id="profileInfo">
        <p id="userName">Adi</p>
        <img src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profilePhoto" height="50px"
            width="50px">
    </div>

</header>
<section>
    <div id="displayResult">
        <h2>Wow You Rank 1st</h2>
        <h3>supporting text </h3>

    </div>
    <div id="rank-holder">
        <div id="ndPlace">
            <div >
                <img id="ndImage" src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profile-image">
            </div>
            <div><h2>score</h2></div>
        </div>
        <div id="stPlace">
            <div>
                <img id="crown" src="assets\crown.svg" alt="crown">
            </div>
            <div>
                <img id="stImage" src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profile-image">
            </div>
            <div><h2>score</h2></div>
        </div>
        <div id="rdPlace">
            <div>
                <img id="rdImage" src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profile-image">
            </div>
            <div><h2>score</h2></div>
        </div>
    </div>
</section>
</html>
