<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

<body>
    <header id="head">
        <div id="techpathshala-logo">
          <img src="assets\techpathshala_logo.svg"  alt="techpathshala_logo" />
        </div>
        <div id="profile-info">
          <p id="profile-name">sudh</p>
          <img
          onclick="profile()"
            src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg"
            alt="profile-image"
            height="35px"
            width="35px"
          />
        </div>
      </header>
      <div id="profileSlide" class="hide">
        <!-- <img id="arrowImg" src="assets/68804.png" alt="" /> -->
        <div class="box">
          <!-- <div class="imageUpload">
            <input type="file" id="imageInput" accept="image/*" />
            <button id="uploadImage" onclick="uploadImage()" class="profileButtons">upload Image</button>
  
          </div> -->
          
          <button class="profileButtons" onclick="logout()">Logout</button>
        </div>
      </div>
    <section>
        <div id="displayResult">
            <h2>Wow You Rank <span id="rankShow">1st</span></h2>
            <h3><span id="nameShow">supporting text</span> </h3>

        </div>
        <div id="rank-holder">
            <div id="ndPlace">
                <h1>#2</h1>
                <img id="ndImage" src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profile-image">
                <div>
                    <h2 id="second">score</h2>
                    <p id="name2">sudhanshu</p>
                </div>
            </div>
            <div id="stPlace">
                <img id="crown" src="assets\crown.svg" alt="crown">
                <img id="stImage" src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profile-image">
                <div>
                    <h2 id="first">score</h2>
                    <p id="name1">name</p>
                </div>
            </div>
            <div id="rdPlace">
                <h1>#3</h1>
                <img id="rdImage" src="assets\WhatsApp Image 2024-09-01 at 12.54.06 PM.jpeg" alt="profile-image">
                <div>
                    <h2 id="third">score</h2>
                    <p id="name3">Name</p>
                </div>
            </div>
        </div>
        <div>
            <img src="assets\scorecard.svg" alt="scorecard" id="semiCircle  ">
        </div>
        <div id="holdersName">
            <div class="others">
                <p>
                    #4. <span id="name4" class="rankspadding ranksFonts"> Name</span>
                </p>
                <span id="rank4">Score</span>

            </div>
            <div class="others">
                <p>
                    #5. <span id="name5" class="rankspadding ranksFonts">Name </span>
                </p>
                <span id="rank5">Score</span>
            </div>
            <div class="others">
                <p>
                    #6. <span id="name6" class="rankspadding ranksFonts">Name </span>
                </p>
                <span id="rank6">Score</span>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
    <script>assignRanks()</script>
</body>

</html>
